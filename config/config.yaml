  allowed_users: 
    - 6337130859                      # تم إضافة ID المشرف هنا

# --- Paths ---
paths:
  dataset_root: "Libyan_ASR_Dataset"
  audio_dir: "audio"
  original_dir: "audio/original"
  rejected_dir: "audio/rejected"
  temp_dir: "temp"
  logs_dir: "logs"
  db_file: "database.sqlite"
  metadata_csv: "metadata.csv"
  dataset_json: "dataset.json"
  train_csv: "train.csv"
  validation_csv: "validation.csv"
  test_csv: "test.csv"
  statistics_json: "statistics.json"
  readme_txt: "README.txt"

# --- Audio Processing ---
audio:
  target_sample_rate: 16000           # Hz
  target_channels: 1                  # Mono
  target_bit_depth: 16                # PCM 16-bit
  min_duration_seconds: 0.5           # Reject files shorter than this
  max_duration_seconds: 30.0          # Warn if longer than this
  silence_threshold_db: -40           # dB threshold for silence trimming
  normalize_target_db: -20.0          # Target loudness for normalization
  supported_formats:
    - "ogg"
    - "mp3"
    - "wav"
    - "m4a"
    - "flac"
    - "oga"                           # Telegram voice messages

# --- Speech-to-Text (Faster-Whisper) ---
transcription:
  model_size: "base"          # tiny / base / small / medium / large-v2
  device: "cpu"                       # cpu or cuda
  compute_type: "int8"                # int8 / float16 / float32
  language: "ar"                      # ar for Arabic; null for auto-detect
  min_confidence: 0.3                 # Reject transcriptions below this
  beam_size: 5
  vad_filter: true                    # Voice Activity Detection filter

# --- Dataset Splits ---
splits:
  train: 0.80
  validation: 0.10
  test: 0.10

# --- Queue & Concurrency ---
processing:
  queue_workers: 1                    # Sequential to protect data integrity
  max_retries: 3
  retry_delay_seconds: 5

# --- Logging ---
logging:
  level: "INFO"                       # DEBUG / INFO / WARNING / ERROR
  max_file_size_mb: 10
  backup_count: 5